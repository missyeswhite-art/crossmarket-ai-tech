
name: Update SEC filings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sec-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official SEC filings
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python scripts/fetch_sec.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/filings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SEC filings data"
            git push
          fi
